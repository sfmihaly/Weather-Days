name: Build and publish

# Builds the dashboard data and the PDF reports from fresh buoy data and publishes the site.
# Nothing is committed back to the repository: the built files go straight to GitHub Pages.
# If any step fails, nothing is published and the previous site stays online.

on:
  schedule:
    - cron: "17 9 * * 1"     # every Monday 09:17 UTC
  push:
    branches: [main]          # republish after every change you push
  workflow_dispatch:          # allow a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build data, reports and site
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
