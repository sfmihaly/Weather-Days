name: Update buoy data

on:
  schedule:
    - cron: "17 9 * * 1"     # every Monday 09:17 UTC
  workflow_dispatch:          # allow a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/build_data.py
      - name: Commit refreshed data if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ assets/bathymetry.jpg assets/bathymetry.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update buoy data"
            git push
          fi
